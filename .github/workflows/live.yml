name: Live

# Runs the combo samples against the public demo exchanges, configured with
# STX_REGION, STX_ENV, STX_KEY_ID and STX_PRIVATE_KEY as the main README
# describes. combo-maker/ quotes as a maker account of its own while combos/,
# as a second account, requests a small combo, takes the best quote and cashes
# it out. A maker cannot quote its own account's request, hence two accounts.
#
# .github/scripts/combos-live.sh checks that combo-maker quoted the request and
# that its quote was the one placed, and that combos/ bought, sold and holds
# nothing at the end. combo-maker quotes only that player's requests, and
# generously enough to lead the other makers on the demo exchanges.
#
# Needs these repository secrets (read_write API keys, the PEM as text):
#   US_DEMO_API_KEY_ID, US_DEMO_API_KEY_PEM                    the player (combos/)
#   US_DEMO_MAKER_API_KEY_ID, US_DEMO_MAKER_API_KEY_PEM        the maker (combo-maker/)
#   ONTARIO_DEMO_API_KEY_ID, ONTARIO_DEMO_API_KEY_PEM
#   ONTARIO_DEMO_MAKER_API_KEY_ID, ONTARIO_DEMO_MAKER_API_KEY_PEM
#
# The fill-modes job runs fill-modes/ with the player's key. On US demo, which offers
# post-only and fill-or-kill, it checks each step's outcome. Ontario demo runs a
# release from before fill modes, which places them as normal orders: there it checks
# the sample noticed, cancelled that order and stopped before the steps that trade.
#
# Never runs on pull requests, so the secrets are not exposed to them.

on:
  push:
    branches: [main]
  schedule:
    - cron: "53 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  combos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: us-demo
            prefix: US_DEMO
            region: us
            env: demo
          - name: ontario-demo
            prefix: ONTARIO_DEMO
            region: ontario
            env: demo
    name: combos (${{ matrix.name }})
    env:
      STX_REGION: ${{ matrix.region }}
      STX_ENV: ${{ matrix.env }}
      STX_KEY_ID: ${{ secrets[format('{0}_API_KEY_ID', matrix.prefix)] }}
      STX_PRIVATE_KEY: ${{ secrets[format('{0}_API_KEY_PEM', matrix.prefix)] }}
      MAKER_KEY_ID: ${{ secrets[format('{0}_MAKER_API_KEY_ID', matrix.prefix)] }}
      MAKER_KEY_PEM: ${{ secrets[format('{0}_MAKER_API_KEY_PEM', matrix.prefix)] }}
    steps:
      - name: API keys
        run: |
          if [ -z "$STX_KEY_ID" ] || [ -z "$STX_PRIVATE_KEY" ] || [ -z "$MAKER_KEY_ID" ] || [ -z "$MAKER_KEY_PEM" ]; then
            echo "::error::Secrets ${{ matrix.prefix }}_API_KEY_ID / _PEM and ${{ matrix.prefix }}_MAKER_API_KEY_ID / _PEM must be set to run the combo samples on ${{ matrix.name }}."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build combo-maker and combos
        run: |
          dotnet build combo-maker/ComboMaker.csproj --configuration Release
          dotnet build combos/Combos.csproj --configuration Release

      - name: combos buys and cashes out, quoted by combo-maker
        run: .github/scripts/combos-live.sh ${{ matrix.name }}

  fill-modes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: us-demo, prefix: US_DEMO, region: us, env: demo, expect: taken }
          - { name: ontario-demo, prefix: ONTARIO_DEMO, region: ontario, env: demo, expect: ignored }
    name: fill-modes (${{ matrix.name }})
    env:
      STX_REGION: ${{ matrix.region }}
      STX_ENV: ${{ matrix.env }}
      STX_KEY_ID: ${{ secrets[format('{0}_API_KEY_ID', matrix.prefix)] }}
      STX_PRIVATE_KEY: ${{ secrets[format('{0}_API_KEY_PEM', matrix.prefix)] }}
    steps:
      - name: API key
        run: |
          if [ -z "$STX_KEY_ID" ] || [ -z "$STX_PRIVATE_KEY" ]; then
            echo "::error::Secrets ${{ matrix.prefix }}_API_KEY_ID / _PEM must be set to run fill-modes on ${{ matrix.name }}."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build fill-modes
        run: dotnet build fill-modes/FillModes.csproj --configuration Release

      - name: fill-modes
        run: |
          set -o pipefail
          dotnet run --no-build --configuration Release --project fill-modes/FillModes.csproj | tee fill-modes.log
          need() { grep -qE "$1" fill-modes.log || { echo "::error::fill-modes on ${{ matrix.name }}: no line matching '$1'"; exit 1; }; }
          if [ "${{ matrix.expect }}" = taken ]; then
            need '^Resting: .* (accepted|open) post_only @ '
            need '^Cancelled: cancelled$'
            need '^Would cross: auto_matching; order .* cancelled \(auto_matching\), filled 0'
            need '^Fill-or-kill: cancelled, filled 0'
          else
            need 'placed the post-only order as a normal order .*; cancelled it\.$'
            if grep -q '^Fill-or-kill' fill-modes.log; then echo "::error::fill-modes went on to trade steps on ${{ matrix.name }}"; exit 1; fi
          fi
