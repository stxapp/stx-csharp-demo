name: Live

# Runs the combo samples against the public demo exchanges, configured with
# STX_REGION, STX_ENV, STX_KEY_ID and STX_PRIVATE_KEY as the main README
# describes. combo-maker/ quotes as a maker account of its own while combos/,
# as a second account, requests a small combo, takes the best quote and cashes
# it out. A maker cannot quote its own account's request, hence two accounts.
#
# .github/scripts/combos-live.sh checks that combo-maker quoted the request and
# that its quote was the one placed, and that combos/ bought, sold and holds
# nothing at the end. Other makers quote on the demo exchanges too, so
# combo-maker quotes generously enough to lead.
#
# Needs these repository secrets (read_write API keys, the PEM as text):
#   US_DEMO_API_KEY_ID, US_DEMO_API_KEY_PEM                    the player (combos/)
#   US_DEMO_MAKER_API_KEY_ID, US_DEMO_MAKER_API_KEY_PEM        the maker (combo-maker/)
#   ONTARIO_DEMO_API_KEY_ID, ONTARIO_DEMO_API_KEY_PEM
#   ONTARIO_DEMO_MAKER_API_KEY_ID, ONTARIO_DEMO_MAKER_API_KEY_PEM
#
# Never runs on pull requests, so the secrets are not exposed to them.

on:
  push:
    branches: [main]
  schedule:
    - cron: "53 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  combos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: us-demo
            prefix: US_DEMO
            region: us
            env: demo
          - name: ontario-demo
            prefix: ONTARIO_DEMO
            region: ontario
            env: demo
    name: combos (${{ matrix.name }})
    env:
      STX_REGION: ${{ matrix.region }}
      STX_ENV: ${{ matrix.env }}
      STX_KEY_ID: ${{ secrets[format('{0}_API_KEY_ID', matrix.prefix)] }}
      STX_PRIVATE_KEY: ${{ secrets[format('{0}_API_KEY_PEM', matrix.prefix)] }}
      MAKER_KEY_ID: ${{ secrets[format('{0}_MAKER_API_KEY_ID', matrix.prefix)] }}
      MAKER_KEY_PEM: ${{ secrets[format('{0}_MAKER_API_KEY_PEM', matrix.prefix)] }}
    steps:
      - name: API keys
        run: |
          if [ -z "$STX_KEY_ID" ] || [ -z "$STX_PRIVATE_KEY" ] || [ -z "$MAKER_KEY_ID" ] || [ -z "$MAKER_KEY_PEM" ]; then
            echo "::error::Secrets ${{ matrix.prefix }}_API_KEY_ID / _PEM and ${{ matrix.prefix }}_MAKER_API_KEY_ID / _PEM must be set to run the combo samples on ${{ matrix.name }}."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build combo-maker and combos
        run: |
          dotnet build combo-maker/ComboMaker.csproj --configuration Release
          dotnet build combos/Combos.csproj --configuration Release

      - name: combos buys and cashes out, quoted by combo-maker
        run: .github/scripts/combos-live.sh ${{ matrix.name }}
